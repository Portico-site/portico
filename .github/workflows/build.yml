name: build

# Builds Portico for Windows, macOS and Linux on GitHub's own runners, so you
# don't need to own a Mac or a Linux box. Run it from the Actions tab
# ("Run workflow"), or push a tag like v0.20.0.
#
# Each job downloads the matching prebuilt llama.cpp binaries, then packages the
# app with electron-builder. Voice (whisper) and image gen are Windows-only for
# now; see resources/RESOURCES.md to add them per platform.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed to attach the installers to a Release. Without it electron-builder can
# build but not publish, and the job fails at the upload with a 403.
permissions:
  contents: write

# Actions are pinned to commit SHAs rather than tags. A tag is a moving pointer: the
# owner of an action — or anyone who compromises that account — can repoint v4 at new
# code, and it would run here with access to the build that produces the installer
# people download. The trailing comment records which tag each SHA was, so they can
# still be read and updated deliberately.

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            llama_pat: bin-win-vulkan-x64
            dest: resources/llama
            eb: --win
          - os: macos-14          # Apple Silicon runner
            llama_pat: bin-macos-arm64
            dest: resources/llama-mac-arm64
            eb: --mac --arm64
          - os: ubuntu-latest
            llama_pat: bin-ubuntu-vulkan-x64
            dest: resources/llama-linux-x64
            eb: --linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Pull the latest llama.cpp release asset for this platform and flatten the
      # server binary + its shared libraries into the platform's resource folder.
      - name: Fetch llama.cpp binaries
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"
          url=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r --arg pat "${{ matrix.llama_pat }}" \
              '.assets[] | select(.name | contains($pat)) | .browser_download_url' | head -n1)
          echo "Asset: $url"
          test -n "$url"
          curl -sL "$url" -o llama.zip
          rm -rf _llama && mkdir _llama && unzip -q -o llama.zip -d _llama
          # find the directory that actually contains llama-server[.exe]
          bindir=$(dirname "$(find _llama -type f -name 'llama-server*' | head -n1)")
          echo "Binaries in: $bindir"
          mkdir -p "${{ matrix.dest }}"
          cp -f "$bindir"/* "${{ matrix.dest }}"/
          # macOS/Linux binaries must be executable after unzip
          chmod +x "${{ matrix.dest }}"/llama-server* 2>/dev/null || true
          ls -la "${{ matrix.dest }}"

      # A manual run is a dry run: it builds and keeps the result as an artifact so
      # the workflow itself can be tested without publishing anything. A tag is the
      # real thing, and publishes.
      #
      # `--publish always` is what makes auto-update work at all. It is not just an
      # upload: electron-builder also writes latest.yml, latest-mac.yml and
      # latest-linux.yml beside the installers, and those are the files
      # electron-updater actually reads. Attaching the installers to a Release by
      # hand would leave the app with nothing to check against.
      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npx electron-builder ${{ matrix.eb }} --publish always
          else
            npx electron-builder ${{ matrix.eb }} --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portico-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
